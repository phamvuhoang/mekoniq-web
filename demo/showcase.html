<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEKONIQ Serve · Trình diễn</title>

<link rel="icon" href="logo.svg"><link rel="stylesheet" href="brand.css">
<style>
  body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  .stage { flex: 1; min-height: 0; display: grid; gap: 10px; padding: 10px; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); grid-template-rows: 1fr 1fr; }
  .pane { position: relative; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--card); min-height: 0; }
  .pane.main { grid-row: span 2; }
  .pane iframe { width: 100%; height: 100%; border: 0; display: block; }
  .tag { position: absolute; left: 10px; bottom: 10px; z-index: 2; background: var(--deep); color: var(--mint); font-size: 11px; font-weight: 900;
    letter-spacing: .12em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; pointer-events: none; }
  .tag a { pointer-events: auto; color: inherit; }
  @media (max-width: 860px) {
    body { height: auto; }
    .stage { grid-template-columns: 1fr; grid-template-rows: none; }
    .pane, .pane.main { grid-row: auto; height: 85vh; }
  }
</style>
</head><body>
