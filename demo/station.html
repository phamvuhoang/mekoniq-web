<!doctype html>
<html lang="vi" data-theme="light"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEKONIQ Serve · Trạm</title>
<link rel="icon" href="logo.svg"><link rel="stylesheet" href="brand.css">
<style>
  /* Dispatch board (spec 4.2): app bar, alert strips, 3 columns (robots + queue | task, pick, tables | order preview), KPI line. One screen, no page scroll. */
  html, body { height: 100%; }
  .appbar .title { flex: none; }
  .appbar .right { gap: 12px; }
  #monLinks { display: flex; gap: 8px; }
  /* Monitor: no role picker on the bar (room for the links); the role still applies (log name, sounds). */
  .screen[data-v=mon] #roleSeg { display: none; }
  #roleSeg .more { padding: 8px 12px; }
  #strips { flex: none; max-height: 30vh; overflow: auto; }

  .desk { grid-template: minmax(0, 1fr) / 270px minmax(0, 1fr) 330px; }
  .side, .mid { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
  .side > .eyebrow.sm { margin: 0; }
  .robots { display: grid; gap: 8px; }
  .rbtn { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 0 10px; padding: 9px 14px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); text-align: left; line-height: 1.25; }
  .rbtn i { width: 12px; height: 12px; border-radius: 50%; grid-row: span 2; }
  .rbtn b { font-size: 16px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rbtn .bt { font: 500 13px var(--mono); }
  .rbtn small { grid-column: 2 / -1; font-size: 12px; font-weight: 700; color: var(--gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rbtn[aria-pressed="true"] { background: var(--deep); border-color: var(--deep); color: var(--card); }
  .rbtn[aria-pressed="true"] small { color: inherit; opacity: .7; }
  .queue { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 14px; }
  .queue h3 { margin: 0 0 4px; font-size: 12px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--gray); }
  .queue ol { flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 0; list-style: none; }
  .queue li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .queue li:last-child { border-bottom: 0; }
  .queue li b { font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .queue li small { font-size: 12px; font-weight: 700; color: var(--gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .queue li small.warn { color: var(--warn-ink); } .queue li small.danger { color: var(--danger); } .queue li small.go { color: var(--green); }
  .queue li > :is(button, .lock, .qa) { grid-row: 1 / span 2; grid-column: 2; }
  .queue .qa { display: flex; gap: 6px; align-items: center; }
  .rt { min-height: 40px; padding: 0 10px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); color: var(--deep); font: 800 13px var(--font); }
  .rt[aria-pressed=true] { background: var(--deep); border-color: var(--deep); color: var(--mint); }
  #pvSend .rts { display: flex; gap: 8px; flex-wrap: wrap; }
  .tt:disabled { opacity: .35; }
  .queue li .pill { padding: 0 6px; font-size: 11px; vertical-align: 2px; margin-right: 4px; }
  .queue .x { min-width: 40px; height: 40px; padding: 0 8px; border: 1.5px solid color-mix(in srgb, var(--danger) 30%, var(--card)); border-radius: 12px; background: var(--card); color: var(--danger); font-weight: 900; }
  .queue .x.armed { background: var(--danger); border-color: var(--danger); color: var(--card); animation: pulse 1s infinite; }
  .queue .lock { font-size: 18px; }
  .queue .empty { padding: 20px 0; }

  .tasks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .task { min-height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1.5px solid var(--line); border-radius: 16px; background: var(--card); color: var(--deep); line-height: 1.15; }
  .task b { font-size: 18px; font-weight: 900; } .task small { font-size: 12px; font-weight: 700; opacity: .65; }
  .task[aria-pressed="true"] { background: var(--deep); border-color: var(--deep); color: var(--card); }
  .pickrow { display: flex; align-items: center; gap: 8px; min-height: 42px; white-space: nowrap; }
  .pickrow .lbl { font-size: 12px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--gray); }
  .pickrow .txt { font-weight: 800; color: var(--ink); }
  .pickrow .cnt { margin-left: auto; font: 500 14px var(--mono); color: var(--gray); }
  .pickrow .cnt.vi { font-family: var(--font); }
  .chip { min-height: 40px; padding: 7px 16px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--card); font-weight: 800; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--card); }
  #grid { --cols: 4; flex: 1; }
  .tt.spot b { font-size: 22px; padding: 4px 0; }

  .pv { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: hidden; }
  #pvHead, #pvOpts { display: flex; flex-direction: column; gap: 8px; }
  /* Alert strips eat height: the notes area shrinks and scrolls, the send buttons always stay whole. */
  #pvHead { flex: none; }
  #pvOpts { flex: 0 1 auto; min-height: 0; overflow: auto; }
  .pv .eyebrow.sm { margin: 0; }
  .pv h2 { margin: 0; font-size: 22px; font-weight: 900; line-height: 1.2; color: var(--deep); overflow-wrap: anywhere; }
  .pv .rl { margin: 0; font-weight: 700; color: var(--gray); }
  .pv .rl .pill { margin-left: 6px; }
  .slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .slot { padding: 6px 4px; border-radius: 12px; background: var(--light); color: var(--gray); text-align: center; line-height: 1.1; }
  .slot span { display: block; font-size: 11px; font-weight: 900; letter-spacing: .1em; }
  .slot b { font-size: 18px; font-weight: 900; }
  .slot.on { background: var(--deep); color: var(--mint); }
  .notes { display: flex; flex-wrap: wrap; gap: 6px; }
  .notes .chip { min-height: 36px; padding: 5px 12px; font-size: 13px; }
  .notes .chip[aria-pressed="true"] { background: var(--deep); border-color: var(--deep); color: var(--mint); }
  #note { min-height: 40px; }
  .urg { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 14px; line-height: 1.2; cursor: pointer; }
  .urg input { width: 22px; height: 22px; flex: none; accent-color: var(--warn); }
  .urg b { display: block; font-weight: 900; } .urg small { font-size: 12px; color: var(--gray); font-weight: 700; }
  .urg:has(input:checked) { border-color: var(--accent); background: var(--pill-warn); }
  #pvSend { flex: none; margin-top: auto; display: grid; gap: 8px; }
  #pvSend .send { --act-h: 104px; }
  #pvSend .act.outline { --act-h: 52px; }
  #pvSend .act.outline b { font-size: 16px; }

  footer.kpis { display: block; flex: none; margin: 0; padding: 10px 16px; background: var(--card); border-top: 1px solid var(--line); font-size: 14px; color: var(--gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  footer.kpis b { color: var(--deep); font-weight: 900; }

  @media (orientation: portrait), (max-width: 900px) {
    .appbar .title { display: none; }
    .appbar { gap: 10px; padding: 0 12px; }
    .seg.dark button { padding: 8px 10px; }
    .screen[data-v=desk] #snd { display: none; }
    .desk { grid-template: auto minmax(0, 1fr) auto / minmax(0, 1fr); }
    .side { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) minmax(0, 1.3fr); gap: 8px; }
    .side > .eyebrow.sm, .robots { grid-column: 1 / 3; }
    .robots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .queue { grid-column: 3; grid-row: 1 / 3; contain: size; }
    .pv { display: grid; grid-template: auto 1fr / minmax(0, 1fr) 280px; gap: 10px 16px; }
    #pvSend { grid-column: 2; grid-row: 1 / 3; margin: 0; align-content: end; }
    #pvSend .send b { font-size: 19px; }
  }
  :root[data-orient=portrait] .appbar .title { display: none; }
  :root[data-orient=portrait] .appbar { gap: 10px; padding: 0 12px; }
  :root[data-orient=portrait] .seg.dark button { padding: 8px 10px; }
  :root[data-orient=portrait] .screen[data-v=desk] #snd { display: none; }
  :root[data-orient=portrait] .desk { grid-template: auto minmax(0, 1fr) auto / minmax(0, 1fr); }
  :root[data-orient=portrait] .side { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) minmax(0, 1.3fr); gap: 8px; }
  :root[data-orient=portrait] .side > .eyebrow.sm, :root[data-orient=portrait] .robots { grid-column: 1 / 3; }
  :root[data-orient=portrait] .robots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  :root[data-orient=portrait] .queue { grid-column: 3; grid-row: 1 / 3; contain: size; }
  :root[data-orient=portrait] .pv { display: grid; grid-template: auto 1fr / minmax(0, 1fr) 280px; gap: 10px 16px; }
  :root[data-orient=portrait] #pvSend { grid-column: 2; grid-row: 1 / 3; margin: 0; align-content: end; }
  :root[data-orient=portrait] #pvSend .send b { font-size: 19px; }

  /* Monitor (spec 4.3): left = tools, floor map card, legend, 6 KPI tiles; right = tabbed panel (fleet / missions / log / sim). */
  .mon { grid-template: minmax(0, 1fr) / minmax(0, 1fr) 420px; }
  .mleft { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
  .tools { flex: none; display: flex; align-items: center; gap: 12px; }
  .tools .seg { flex-wrap: nowrap; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
  .tools .seg button { min-height: 36px; padding: 6px 14px; border: 0; font-size: 13px; font-weight: 800; white-space: nowrap; }
  .tools .hint { flex: 1; min-width: 0; margin: 0; font-size: 12px; font-weight: 600; line-height: 1.3; color: var(--gray);
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .tools .btn { flex: none; background: var(--card); }
  .mapcard { flex: 1; min-height: 0; display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); padding: 10px; }
  #map, #vmap { width: 100%; height: 100%; min-height: 0; display: block; border-radius: 12px; }
  #map { background: none; }
  #legend { flex: none; }
  #legend .legend { margin: 0; flex-wrap: nowrap; gap: 6px 16px; white-space: nowrap; overflow: hidden; font-weight: 700; }
  #legend .legend i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--deep); }
  #legend .vhint { margin: 0; font-size: 12px; font-weight: 600; color: var(--gray); }
  .ktiles { flex: none; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
  .kpi { padding: 8px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); line-height: 1.2; }
  .kpi b { display: block; font-size: 24px; font-weight: 900; color: var(--deep); letter-spacing: -.02em; white-space: nowrap; }
  .kpi span { display: block; font-size: 12px; font-weight: 700; color: var(--gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Map */
  #map .tbl { cursor: pointer; }
  #map .tbl.busy { stroke: var(--green); stroke-width: .14; }
  #map .tbl.sel { fill: var(--deep); stroke: var(--deep); }
  #map .tbl.sel + text { fill: var(--mint); }
  #map .rb { transition: transform .5s linear; }
  #map .rb circle { stroke: var(--deep); stroke-width: .09; }
  #map .rb text { font-size: .4px; font-weight: 900; fill: var(--deep); }
  #map .rb .ring { fill: none; stroke: var(--danger); stroke-width: .09; }
  #map.placing { cursor: crosshair; }
  #map.placing .tbl, #map.placing g[data-f] { cursor: crosshair; }

  /* Side panel: underline tabs, body scrolls inside */
  .panel { display: flex; flex-direction: column; min-height: 0; padding: 0; overflow: hidden; }
  .ptabs { flex: none; display: flex; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--line); }
  .ptabs button { flex: 1; min-height: 48px; padding: 0 6px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--gray); font-size: 14px; font-weight: 800; white-space: nowrap; }
  .ptabs button[aria-pressed="true"] { border-bottom-color: var(--deep); color: var(--deep); }
  .pbody { flex: 1; min-height: 0; overflow: auto; padding: 12px; }

  /* Missions */
  .mission { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  .mission.urgent { border-color: var(--accent); border-width: 2px; }
  .mrow { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .mrow > b { font-weight: 900; color: var(--deep); }
  .stops { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .stop { display: inline-flex; align-items: center; gap: 4px; border-radius: 9px; padding: 3px 8px; font-size: 12px; font-weight: 700; background: var(--soft); }
  .stop.done { background: var(--pill-ok); }
  .stop.active { background: var(--deep); color: var(--mint); }
  .stop.cancelled { background: var(--pill-warn); color: var(--warn-ink); }
  .stop.skipped { text-decoration: line-through; opacity: .55; }
  .stop.manual { background: var(--danger); color: var(--card); }
  .stop button { border: 0; background: transparent; padding: 0 2px; font-weight: 900; color: inherit; }
  .stop button.armed { background: var(--danger); color: var(--card); border-radius: 6px; padding: 0 6px; }
  .empty { color: var(--muted); padding: 16px 0; text-align: center; }

  /* Fleet */
  .robot { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  .robot.halt { border: 2px solid var(--accent); background: color-mix(in srgb, var(--pill-warn) 35%, var(--card)); }
  .robot .rid { display: inline-flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 900; color: var(--deep); }
  .robot .rid i { width: 12px; height: 12px; border-radius: 50%; }
  .bat { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; margin: 8px 0; }
  .bat > div { height: 100%; background: var(--green); }
  .bat.low > div { background: var(--danger); }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  /* Log: 52px time column, colour by level */
  .logrow { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.35; }
  .logrow time { font-size: 12px; font-weight: 600; color: var(--gray); font-variant-numeric: tabular-nums; }
  .logrow .warn { color: var(--warn-ink); } .logrow .error { color: var(--danger); font-weight: 700; } .logrow .ok { color: var(--green); }

  /* Sim tab */
  .simcap { margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--gray); }
  .pbody .seg { margin-bottom: 12px; }
  .pbody .seg button { min-height: 40px; padding: 6px 16px; }
  .simgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .simgrid button { min-height: 52px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card); color: var(--deep); font-weight: 800; line-height: 1.2; }
  .simgrid .es { border-color: var(--pill-danger); background: var(--pill-danger); color: var(--danger); }
  .pbody .reset { width: 100%; min-height: 48px; }

  @media (orientation: portrait), (max-width: 900px) {
    .mon { grid-template: auto minmax(0, 1fr) / minmax(0, 1fr); }
    .mapcard { flex: 0 0 auto; aspect-ratio: var(--ar, 16 / 10); max-height: 42vh; }
    .ktiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  :root[data-orient=portrait] .mon { grid-template: auto minmax(0, 1fr) / minmax(0, 1fr); }
  :root[data-orient=portrait] .mapcard { flex: 0 0 auto; aspect-ratio: var(--ar, 16 / 10); max-height: 42vh; }
  :root[data-orient=portrait] .ktiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }

  dialog { border: 0; border-radius: var(--radius); padding: 24px; background: var(--card); color: var(--fg); width: min(460px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(7, 29, 33, .6); }
  .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .roles button { min-height: 64px; }
</style>
</head><body>
<div class="screen">
  <header id="bar"></header>
  <div id="strips" aria-live="assertive"></div>

  <main class="desk body" id="desk">
    <aside class="side">
      <p class="eyebrow sm">Robot · chọn để chỉ định</p>
      <div class="robots" id="robots"></div>
      <section class="card queue"><h3 id="qhead">Hàng chờ</h3><ol id="queue"></ol></section>
    </aside>
    <section class="mid">
      <div class="tasks" id="tasks"></div>
      <div class="pickrow" id="pick"></div>
      <div class="tt-grid" id="grid"></div>
    </section>
    <section class="card pv">
      <div id="pvHead"></div>
      <div id="pvOpts"></div>
      <div id="pvSend"></div>
    </section>
  </main>

  <main class="mon body" id="mon" hidden>
    <section class="mleft">
      <div class="tools" id="tools"><div class="seg" id="mode"></div><p class="hint" id="modeHint"></p><button class="btn sm" data-act="obClear" id="obClear">Gỡ vật cản (0)</button></div>
      <div class="card mapcard" id="mapbox">
        <svg id="map" class="floor" role="img" aria-label="Sơ đồ nhà hàng, lối đi và vị trí robot"></svg>
        <canvas id="vmap" hidden></canvas>
      </div>
      <div id="legend"></div>
      <div class="ktiles" id="kpi"></div>
    </section>
    <section class="card panel">
      <nav class="ptabs" id="ptabs"></nav>
      <div class="pbody" id="pbody"></div>
    </section>
  </main>

  <footer class="kpis" id="foot"></footer>
</div>

<dialog id="setup">
  <p class="eyebrow">Thiết lập máy trạm</p>
  <h2 style="margin:0 0 14px" id="setupQ">Máy này dùng ở đâu?</h2>
  <div class="roles" id="roles"></div>
  <div class="field"><label for="sname">Tên máy (hiện trong nhật ký)</label><input type="text" id="sname" maxlength="30" placeholder="VD: Bếp nóng 1"></div>
  <button class="btn primary submit" id="saveSetup">Lưu</button> <button class="btn snd" type="button">Bật âm thanh</button>
</dialog>
<div id="offline" hidden>Mất kết nối tới hệ thống điều phối — đang kết nối lại…</div>

<script src="transport.js"></script><script src="common.js"></script><script src="vmap.js"></script>
<script>
const $ = id => document.getElementById(id);

// ---- App bar: role segmented (left), view segmented + sound (right) ----
$('bar').outerHTML = APPBAR({ title: 'MEKONIQ Serve', sub: 'Điều phối · Dispatch',
  right: `<div class="seg dark" id="views"><button data-view="desk">Điều phối</button><button data-view="mon">Giám sát</button></div>
    <span id="monLinks" hidden><a class="lnk" id="routeLnk" href="map.html" target="_blank" hidden>Thiết kế lộ trình ↗</a><a class="lnk" href="setup.html" target="_blank">Cấu hình ↗</a></span>
    <button class="lnk snd" id="snd">Bật âm thanh</button>` });
document.querySelector('.appbar .title').insertAdjacentHTML('afterend', '<div class="seg dark" id="roleSeg"></div>');
startClock();

// ---- Station identity (per device, remembered locally) ----
const qs = new URLSearchParams(location.search);
let me = null;
try { me = JSON.parse(localStorage.getItem('mekoniq.station')); } catch (e) {}
if (qs.get('role')) me = { role: qs.get('role'), name: qs.get('name') || '' };
const role = () => App.site.roles.find(r => r.id === (me && me.role)) || App.site.roles[0];
const by = () => (me && me.name) || role().name;
const saveMe = () => { try { localStorage.setItem('mekoniq.station', JSON.stringify(me)); } catch (e) {} };
// First run (no identity yet): pick the role once + name. Afterwards only the name; the role lives on the app bar.
function openSetup() {
  const first = !me;
  let pick = (me && me.role) || 'bep';
  const draw = () => $('roles').innerHTML = App.site.roles.map(r =>
    `<button class="pick" data-r="${r.id}" aria-pressed="${r.id === pick}"><b>${esc(r.name)}</b></button>`).join('');
  $('roles').hidden = !first;
  $('setupQ').textContent = first ? 'Máy này dùng ở đâu?' : 'Tên máy trạm';
  if (first) draw();
  $('roles').onclick = e => { const b = e.target.closest('[data-r]'); if (b) { pick = b.dataset.r; draw(); } };
  $('sname').value = (me && me.name) || '';
  $('saveSetup').onclick = () => {
    me = { role: pick, name: $('sname').value.trim() };
    saveMe();
    $('setup').close(); applyRole();
  };
  $('setup').showModal();
}
function applyRole() {
  setHTML($('roleSeg'), App.site.roles.map(r => `<button data-role="${esc(r.id)}" ${press(r.id === role().id)}>${esc(r.name)}</button>`).join('') +
    `<button class="more" data-more title="Tên máy: ${esc(by())}" aria-label="Đổi tên máy">…</button>`);
  F.tab = role().tab;
  F.from = role().home && App.site.points[role().home].kind === 'station' ? role().home : 'kitchen';
  choose();
}
$('roleSeg').onclick = e => {
  if (e.target.closest('[data-more]')) return openSetup();
  const b = e.target.closest('[data-role]');
  if (!b) return;
  me = { role: b.dataset.role, name: (me && me.name) || '' };
  saveMe(); applyRole();
};

function missionHTML(m) {
  const [stText, tone] = missionStatus(m);
  const stops = m.stops.map((s, i) => {
    const k = `cs-${m.id}-${i}`;
    const x = s.a === 'handoff' && open(s) ? `<button data-act="cancelStop" data-m="${m.id}" data-s="${i}" class="${isArmed(k) ? 'armed' : ''}" title="Huỷ bàn này">${isArmed(k) ? 'Huỷ?' : '×'}</button>` : '';
    return `<span class="stop ${s.status}" title="${esc(s.why ? 'Huỷ bởi ' + s.by : '')}">${ICON[s.status] || ''}${esc(stopText(s))}${x}</span>`;
  }).join('');
  const lockedBus = m.kind === 'bus' && m.loaded;
  const k = 'cm-' + m.id;
  return `<div class="mission ${m.urgent ? 'urgent' : ''}">
    <div class="mrow"><b>${esc(m.label)}</b>${m.urgent ? '<span class="pill warn">GẤP</span>' : ''}</div>
    <div class="mrow small"><span class="muted">${esc(m.by)} · <span data-ago="${m.createdAt}"></span></span><span class="pill ${tone}">${m.robot ? m.robot + ' · ' : ''}${esc(stText)}</span></div>
    ${m.note ? `<div class="small">📝 ${esc(m.note)}</div>` : ''}
    <div class="stops">${stops}</div>
    <div class="mrow">${m.loaded ? '<span class="small muted">Đồ đang trên khay</span>' : '<span></span>'}
      ${arrived(m) ? receiveBtn(m, 'btn sm primary') : backStop(m) ? '<span class="small muted">Đang mang đồ về — chờ nhận lại</span>' :
      lockedBus ? '<span class="small muted">Đang chở chén bẩn — không huỷ</span>' :
      `<button class="btn sm ${isArmed(k) ? 'armed' : 'warn'}" data-act="cancel" data-m="${m.id}">${isArmed(k) ? 'Chạm lần nữa để huỷ' : 'Huỷ nhiệm vụ'}</button>`}</div>
  </div>`;
}

// ---- Fleet ----
function robotHTML(r) {
  const [t, tone] = robotStatus(r);
  const m = missionOf(r), bat = Math.round(r.battery), k = 'man-' + r.id;
  const acts = [];
  if (r.halt === 'paused') acts.push(`<button class="btn sm primary" data-act="resume" data-r="${r.id}">Chạy tiếp</button>`);
  else if (!r.halt && !r.offline) acts.push(`<button class="btn sm" data-act="pause" data-r="${r.id}">Tạm dừng</button>`);
  if ((r.halt === 'blocked' || r.nav === 'wait') && r.why !== 'noroute') acts.push(`<button class="btn sm ${r.halt ? 'primary' : ''}" data-act="clear" data-r="${r.id}">Đã dọn lối đi</button>`);
  if (r.halt === 'estop') acts.push(`<span class="small">Nhả dừng tại màn hình robot</span>`);
  if (m) acts.push(`<button class="btn sm ${isArmed(k) ? 'armed' : ''}" data-act="manual" data-r="${r.id}" title="Nhân viên tự hoàn tất việc, robot về trạm">${isArmed(k) ? 'Xác nhận?' : 'Xử lý thủ công'}</button>`);
  acts.push(`<a class="btn sm" href="robot.html?robot=${r.id}" target="_blank">Màn robot ↗</a>`);
  return `<div class="robot ${r.halt ? 'halt' : ''}" data-rid="${esc(r.id)}">
    <div class="mrow"><span class="rid"><i style="background:${TONE[tone]}"></i>${r.id}</span><span class="pill ${tone}">${esc(t)}</span></div>
    <div class="bat ${bat < App.site.timing.lowBattery ? 'low' : ''}"><div></div></div>
    <div class="mrow small"><span class="muted">${m ? esc(m.label) : 'Không có nhiệm vụ'}</span><span class="live"></span></div>
    <div class="acts">${acts.join('')}</div></div>`;
}

// ---- KPI / log / alerts ----
function renderOps() {
  const k = App.state.kpi;
  const base = k.delivered + k.timeout + k.failed;
  const tiles = [   // [value, short label, full label]
    [k.delivered, 'Lượt giao', 'Lượt giao thành công'],
    [base ? Math.round(k.delivered / base * 100) + '%' : '—', 'Hoàn thành', 'Mission completion'],
    [k.delivered ? (k.deliverySecSum / k.delivered / 60).toFixed(1) + "'" : '—', 'TB gọi → nhận', 'TB từ gọi → khách nhận'],
    [k.interventions, 'Can thiệp', 'Lần can thiệp'],
    [k.reroutes || 0, 'Đi vòng vật cản', 'Lần đi vòng tránh vật cản'],
    [`${k.cancelledCustomer}/${k.cancelledStaff}/${k.timeout}`, 'Huỷ KH/NV/giờ', 'Huỷ: khách/nhân viên/quá giờ'],
  ];
  setHTML($('kpi'), tiles.map(([v, l, full]) => `<div class="kpi" title="${full}"><b>${v}</b><span>${l}</span></div>`).join(''));
  // Blocked robot (alert key blk-<robot>): the strip also offers "Đã dọn lối đi" -> the usual clear; not for noroute (same key), clearing can't fix it.
  setHTML($('strips'), strip(App.state.alerts, a => { const r = App.state.robots.find(x => a.key === 'blk-' + x.id && x.why !== 'noroute');
    return r ? `<button class="btn sm dark" data-act="clear" data-r="${r.id}">Đã dọn lối đi</button>` : ''; }));
}

// ---- Side panel: one tab at a time; render() fills only the active one ----
let PTAB = 'fleet', SIMR = null;
const PTABS = { fleet: 'Đội robot', missions: 'Nhiệm vụ', log: 'Nhật ký', sim: 'Mô phỏng' };
const SIMS = [['block', 'Vật cản trước robot', 'Đặt ghế trên lối đi ngay trước robot'], ['clear', 'Gỡ vật cản quanh robot', ''],
  ['offline', 'Mất kết nối', ''], ['online', 'Kết nối lại', ''], ['lowbat', 'Pin yếu', '']];
function simHTML() {
  const ids = App.site.robots.map(r => r.id);
  if (!ids.includes(SIMR)) SIMR = ids[0];
  return `<p class="simcap">Chỉ có trong bản demo simulator. Robot thật báo các sự kiện này qua Robot Adapter.</p>
    <div class="seg">${ids.map(id => `<button data-simr="${esc(id)}" ${press(id === SIMR)}>${esc(id)}</button>`).join('')}</div>
    <div class="simgrid">${SIMS.map(([f, t, tip]) => `<button data-act="sim" data-f="${f}" title="${tip}">${t}</button>`).join('')}<button class="es" data-act="estop">Dừng khẩn cấp</button></div>
    <button class="btn reset ${isArmed('reset') ? 'armed' : ''}" data-act="reset">${isArmed('reset') ? 'Xoá hết dữ liệu demo?' : '↺ Khởi động lại demo'}</button>`;
}
function renderPanel() {
  if (!App.state) return;
  if (PTAB === 'sim' && !hasSim()) PTAB = 'fleet';
  const ms = sortMissions();
  setHTML($('ptabs'), Object.entries(PTABS).filter(([k]) => k !== 'sim' || hasSim()).map(([k, t]) =>
    `<button data-ptab="${k}" ${press(PTAB === k)}>${t}${k === 'missions' ? ' · ' + ms.length : ''}</button>`).join(''));
  setHTML($('pbody'), PTAB === 'fleet' ? App.state.robots.map(robotHTML).join('')
    : PTAB === 'missions' ? ms.map(missionHTML).join('') || '<p class="empty">Không có nhiệm vụ nào</p>'
    : PTAB === 'log' ? App.state.log.map(l => `<div class="logrow"><time>${clock(l.t)}</time><span class="${l.level}">${esc(l.text)}</span></div>`).join('') || '<p class="empty">Chưa có hoạt động</p>'
    : simHTML());
  live();
}
// Battery, ETA and "x giây trước" change every tick: filled in after setHTML so buttons are not re-created each second.
function live() {
  for (const el of $('pbody').querySelectorAll('[data-rid]')) {
    const r = App.state.robots.find(x => x.id === el.dataset.rid);
    if (!r) continue;
    const bat = Math.round(r.battery);
    el.querySelector('.bat div').style.width = bat + '%';
    el.querySelector('.live').textContent = `Pin ${bat}%${r.charging ? ' · sạc' : ''}${r.phase === 'toStop' ? ' · ~' + etaSec(r) + 's' : ''}`;
  }
  for (const el of $('pbody').querySelectorAll('[data-ago]')) el.textContent = ago(+el.dataset.ago) + ' trước';
}
$('ptabs').onclick = e => { const b = e.target.closest('[data-ptab]'); if (b) { PTAB = b.dataset.ptab; renderPanel(); $('pbody').scrollTop = 0; } };
$('pbody').addEventListener('click', e => { const b = e.target.closest('[data-simr]'); if (b) { SIMR = b.dataset.simr; renderPanel(); } });

function render() {
  if (!App.state) return;
  renderPanel(); renderOps(); renderMap(); renderDesk();
}

document.body.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.dataset.act === 'create') return;
  const a = b.dataset.act, m = +b.dataset.m, r = b.dataset.r;
  if (a === 'receive') { const x = App.state.missions.find(y => y.id === m); if (x && arrived(x)) send({ type: 'confirm', robot: x.robot, mission: x.id, stop: x.cur, by: by() }); }
  if (a === 'cancel') armed('cm-' + m, () => send({ type: 'cancel', mission: m, by: by() }), render);
  if (a === 'cancelStop') armed(`cs-${m}-${b.dataset.s}`, () => send({ type: 'cancelStop', mission: m, stop: +b.dataset.s, by: by() }), render);
  if (a === 'manual') armed('man-' + r, () => send({ type: 'manual', robot: r, by: by() }), render);
  if (['pause', 'resume', 'clear'].includes(a)) send({ type: a, robot: r, by: by() });
  if (a === 'ack') send({ type: 'ack', alert: +b.dataset.id });
  if (a === 'sim') send({ type: 'sim', robot: SIMR, fault: b.dataset.f, by: by() });
  if (a === 'estop') send({ type: 'estop', robot: SIMR, by: by() });
  if (a === 'obClear') send({ type: 'obstacle', remove: 'all', by: by() });
  if (a === 'reset') armed('reset', () => send({ type: 'reset', by: by() }), renderPanel);
});

// Station hears cues for its own location; alerts go to everyone.
function hears(e) { return e.stationSound === 'alert' || !e.point || !role().home || role().home === e.point; }

let first = true;
connect(m => {
  if (m.type === 'site') {
    mapBuilt = false;   // robots / tables may have changed: rebuild the floor plan on the next render
    if (first) { first = false; if (!me) openSetup(); applyRole(); }
    return;
  }
  if (m.type === 'state' || m.type === 'map') render();
  if (m.type === 'event' && m.reply) toast(m.text, 'warn');   // refusal sent to this screen only
  if (m.type === 'event' && m.stationSound && hears(m)) {
    play(m.stationSound);
    toast(m.text, m.stationSound === 'alert' ? 'error' : m.stationSound === 'cancelled' ? 'warn' : 'info');
  }
});
setInterval(render, 1000);   // keeps "x giây trước" fresh
</script>
</body></html>
