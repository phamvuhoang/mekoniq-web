<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEKONIQ Serve · Bàn của bạn</title>
<link rel="icon" href="logo.svg"><link rel="stylesheet" href="brand.css">
<style>
  body { background: var(--bg-app); }
  .phone { max-width: 480px; min-height: 100vh; min-height: 100dvh; margin: auto; background: #f6f8f4; display: flex; flex-direction: column; }
  @media (min-width: 481px) { .phone { border-inline: 1px solid var(--line); } }
  header.hd { display: flex; align-items: center; gap: 10px; padding: 14px 20px; }
  header.hd #lang { margin-left: auto; display: flex; gap: 6px; }
  main { flex: 1; padding: 8px 20px 32px; display: grid; gap: 14px; align-content: start; }
  h1 { font-size: 52px; font-weight: 900; letter-spacing: -.05em; margin: 0; line-height: 1; }
  #list { display: grid; gap: 14px; }
  .item { display: grid; gap: 10px; border-radius: 22px; padding: 18px; }
  .item .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .item .row b { font-size: 18px; font-weight: 900; }
  .item .what { color: var(--muted); }
  .steps { display: flex; gap: 4px; }
  .steps i { flex: 1; height: 6px; border-radius: 3px; background: var(--soft); }
  .steps i.on { background: var(--green); }
  .item .status { font-size: 17px; font-weight: 800; }
  .item .status.ok { color: var(--green); }
  .item .status.cancel { color: var(--warn-ink); }
  .item .act { min-height: 56px; }
  .item .act b { font-size: 17px; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
</style>
</head><body>
<div class="phone">
<header class="hd"><div id="brand"></div><div id="lang"></div><span class="dot" id="conn" title="Kết nối"></span></header>
<main>
  <div><p class="eyebrow">Theo dõi món của bạn</p><h1 id="title">Bàn</h1></div>
  <div id="list"></div>
  <p class="small muted">Bạn có thể huỷ món đang trên đường tới. Nếu món đã lên khay, robot sẽ mang món về lại bếp/quầy. Cần hỗ trợ khác, vui lòng gọi nhân viên.</p>
</main>
<!-- Footer "Gọi nhân viên" / "Xin hoá đơn": phase 2, see spec §6.1 (not rendered in phase 1). -->
</div>
<div id="offline" hidden>Mất kết nối — đang kết nối lại…</div>
<script src="transport.js"></script><script src="common.js"></script>
<script>
// Opened from the QR code on each table: table.html?t=T05
const T = new URLSearchParams(location.search).get('t') || 'T01';
const $ = id => document.getElementById(id);
$('brand').innerHTML = BRAND('Serve S1 · Khách hàng');

function item(m, i, s) {
  const r = m.robot && App.state.robots.find(x => x.id === m.robot);
  const what = pname(m.stops[0].p) === 'Quầy pha chế' ? 'Đồ uống' : 'Món ăn';
  let text, step, tone = '';
  const open = s.status === 'pending' || s.status === 'active';
  if (s.status === 'done') [text, step, tone] = ['Đã nhận · chúc ngon miệng', 4, 'ok'];
  else if (!open) [text, step, tone] = [s.why === 'customer' ? 'Bạn đã huỷ món này' : 'Món đã được huỷ', 0, 'cancel'];
  else if (m.status === 'queued') [text, step] = ['Đang chờ robot', 1];
  else if (!m.loaded) [text, step] = [`${pname(m.stops[0].p)} đang chuẩn bị · robot ${m.robot} tới lấy`, 2];
  else if (m.cur === i && r.phase === 'atStop') [text, step, tone] = [`Robot ${m.robot} đã tới bàn — mời lấy món ở khay ${s.tray}`, 4, 'ok'];
  else if (m.cur === i) [text, step] = [`Robot ${m.robot} đang tới · ${etaSec(r) ? `khoảng ${etaSec(r)} giây` : 'sắp tới'}`, 3];
  else [text, step] = [`Robot ${m.robot} đang giao bàn khác trước, sau đó tới bàn bạn`, 3];
  if (open && r && r.halt) text += ' (robot đang tạm dừng)';
  const k = `c-${m.id}-${i}`;
  return `<div class="card item">
    <div class="row"><b>${what} #${m.id}${s.tray ? ' · khay ' + s.tray : ''}</b><span class="small muted">${clock(m.createdAt)}</span></div>
    <div class="what">${esc(m.note || what)}</div>
    ${open || s.status === 'done' ? `<div class="steps">${[1, 2, 3, 4].map(n => `<i class="${n <= step ? 'on' : ''}"></i>`).join('')}</div>` : ''}
    <div class="status ${tone}">${esc(text)}</div>
    ${open ? `<button class="act warn${isArmed(k) ? ' armed' : ''}" data-m="${m.id}" data-s="${i}"><b>${isArmed(k) ? 'Chạm lần nữa để huỷ món' : 'Huỷ món này'}</b></button>` : ''}
  </div>`;
}
function render() {
  if (!App.state) return;
  $('title').textContent = pname(T);
  const rows = [];
  for (const m of [...App.state.missions, ...App.state.history]) {
    if (m.status !== 'queued' && m.status !== 'active' && serverNow() - (m.endedAt || 0) > 30 * 60 * 1000) continue;
    m.stops.forEach((s, i) => { if (s.a === 'handoff' && s.p === T) rows.push(item(m, i, s)); });
  }
  setHTML($('list'), rows.join('') || '<p class="empty">Chưa có món nào đang tới bàn của bạn.</p>');
}
$('list').addEventListener('click', e => {
  const b = e.target.closest('[data-m]');
  if (!b) return;
  const m = +b.dataset.m, s = +b.dataset.s;
  armed(`c-${m}-${s}`, () => send({ type: 'cancelStop', mission: m, stop: s, why: 'customer', by: 'Khách ' + pname(T) + ' (QR)' }), render);
});
connect(m => { if (m.type === 'state') render(); });
setInterval(render, 1000);
</script>
</body></html>
