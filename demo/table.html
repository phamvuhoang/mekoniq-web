<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEKONIQ Serve · Bàn của bạn</title>
<link rel="icon" href="logo.svg"><link rel="stylesheet" href="brand.css">
<style>
  body { background: var(--bg-app); }
  .phone { max-width: 480px; min-height: 100vh; min-height: 100dvh; margin: auto; background: #f6f8f4; display: flex; flex-direction: column; }
  @media (min-width: 481px) { .phone { border-inline: 1px solid var(--line); } }
  header.hd { display: flex; align-items: center; gap: 10px; padding: 14px 20px; }
  header.hd #lang { margin-left: auto; display: flex; gap: 6px; }
  main { flex: 1; padding: 8px 20px 32px; display: grid; gap: 14px; align-content: start; }
  h1 { font-size: 52px; font-weight: 900; letter-spacing: -.05em; margin: 0; line-height: 1; }
  #list { display: grid; gap: 14px; }
  .item { display: grid; gap: 10px; border-radius: 22px; padding: 18px; }
  .item .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .item .row b { font-size: 18px; font-weight: 900; }
  .item .what { color: var(--muted); }
  .steps { display: flex; gap: 4px; }
  .steps i { flex: 1; height: 6px; border-radius: 3px; background: var(--soft); }
  .steps i.on { background: var(--green); }
  .item .status { font-size: 17px; font-weight: 800; }
  .item .status.ok { color: var(--green); }
  .item .status.cancel { color: var(--warn-ink); }
  .item .act { min-height: 56px; }
  .item .act b { font-size: 17px; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
  #lang button { min-height: 36px; padding: 6px 12px; }
  footer.ft { position: sticky; bottom: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); background: #f6f8f4; border-top: 1px solid var(--line); }
  footer.ft .act { min-height: 64px; }
  footer.ft .act b { font-size: 17px; }
  body.ft .toasts { bottom: 120px; }
</style>
</head><body>
<div class="phone">
<header class="hd"><div id="brand"></div><div class="seg" id="lang"></div><span class="dot" id="conn" title="Kết nối"></span></header>
<main>
  <div><p class="eyebrow" id="eyebrow"></p><h1 id="title">Bàn</h1></div>
  <div id="list"></div>
  <p class="small muted" id="help"></p>
</main>
<footer class="ft" id="foot" hidden></footer>
</div>
<div id="offline" hidden></div>
<script src="transport.js"></script><script src="common.js"></script>
<script>
// Opened from the QR code on each table: table.html?t=T05
const T = new URLSearchParams(location.search).get('t') || 'T01';
const $ = id => document.getElementById(id);

// Guest-facing strings, VI + EN (spec 6.5). Functions take the params status() returns.
const DICT = {
  vi: { brand: 'Serve S1 · Khách hàng', eyebrow: 'Theo dõi món của bạn', table: t => 'Bàn ' + t, food: 'Món ăn', drink: 'Đồ uống', tray: 'khay',
    help: 'Bạn có thể huỷ món đang trên đường tới. Nếu món đã lên khay, robot sẽ mang món về lại bếp/quầy. Cần hỗ trợ khác, vui lòng gọi nhân viên.',
    empty: 'Chưa có món nào đang tới bàn của bạn.', offline: 'Mất kết nối — đang kết nối lại…',
    done: () => 'Đã nhận · chúc ngon miệng', mine: () => 'Bạn đã huỷ món này', cancelled: () => 'Món đã được huỷ', queued: () => 'Đang chờ robot',
    prep: p => `${p.place} đang chuẩn bị · robot ${p.robot} tới lấy`, here: p => `Robot ${p.robot} đã tới bàn — mời lấy món ở khay ${p.tray}`,
    coming: p => `Robot ${p.robot} đang tới · ${p.eta ? `khoảng ${p.eta} giây` : 'sắp tới'}`, other: p => `Robot ${p.robot} đang giao bàn khác trước, sau đó tới bàn bạn`,
    paused: ' (robot đang tạm dừng)', cancel: 'Huỷ món này', sure: 'Chạm lần nữa để huỷ món',
    order: 'Đơn', orderNew: 'Bếp đã nhận · đang chuẩn bị', orderPaid: 'Đã báo chuyển khoản · chờ nhân viên xác nhận', total: 'Tổng',
    staff: 'Gọi nhân viên', bill: 'Xin hoá đơn', staffOk: 'Đã gọi nhân viên — vui lòng chờ', billOk: 'Đã xin hoá đơn — nhân viên sẽ mang tới' },
  en: { brand: 'Serve S1 · Guest', eyebrow: 'Track your order', table: t => 'Table ' + t, food: 'Food', drink: 'Drinks', tray: 'tray',
    help: 'You can cancel an item on its way. If it is already on a tray, the robot takes it back to the kitchen/bar. For anything else, please call staff.',
    empty: 'Nothing on its way to your table yet.', offline: 'Connection lost — reconnecting…',
    done: () => 'Received · enjoy your meal', mine: () => 'You cancelled this item', cancelled: () => 'This item was cancelled', queued: () => 'Waiting for a robot',
    prep: p => `${p.place} is preparing · robot ${p.robot} picks it up`, here: p => `Robot ${p.robot} is at your table — please take tray ${p.tray}`,
    coming: p => `Robot ${p.robot} on the way · ${p.eta ? `about ${p.eta} s` : 'arriving'}`, other: p => `Robot ${p.robot} serves another table first, then yours`,
    paused: ' (robot paused)', cancel: 'Cancel this item', sure: 'Tap again to cancel',
    order: 'Order', orderNew: 'Kitchen received · preparing', orderPaid: 'Payment reported · waiting for staff', total: 'Total',
    staff: 'Call staff', bill: 'Request bill', staffOk: 'Staff called — please wait', billOk: 'Bill requested — staff will bring it' },
};
let lang = 'vi';
try { if (localStorage.getItem('mekoniq.lang') === 'en') lang = 'en'; } catch (e) {}
const tr = k => DICT[lang][k];

// Delivery status of one stop -> [key, params, step 0-4, tone]. Shared by both languages.
function status(m, i, s, r) {
  const open = s.status === 'pending' || s.status === 'active';
  if (s.status === 'done') return ['done', {}, 4, 'ok'];
  if (!open) return [s.why === 'customer' ? 'mine' : 'cancelled', {}, 0, 'cancel'];
  if (m.status === 'queued') return ['queued', {}, 1, ''];
  if (!m.loaded) return ['prep', { place: pname(m.stops[0].p), robot: m.robot }, 2, ''];
  if (m.cur === i && r.phase === 'atStop') return ['here', { robot: m.robot, tray: s.tray }, 4, 'ok'];
  if (m.cur === i) return ['coming', { robot: m.robot, eta: etaSec(r) }, 3, ''];
  return ['other', { robot: m.robot }, 3, ''];
}
function item(m, i, s) {
  const r = m.robot && App.state.robots.find(x => x.id === m.robot);
  const what = tr(pname(m.stops[0].p) === 'Quầy pha chế' ? 'drink' : 'food');
  const open = s.status === 'pending' || s.status === 'active';
  const [key, params, step, tone] = status(m, i, s, r);
  const text = tr(key)(params) + (open && r && r.halt ? tr('paused') : '');
  const k = `c-${m.id}-${i}`;
  return `<div class="card item">
    <div class="row"><b>${what} #${m.id}${s.tray ? ` · ${tr('tray')} ${s.tray}` : ''}</b><span class="small muted">${clock(m.createdAt)}</span></div>
    <div class="what">${esc(m.note || what)}</div>
    ${open || s.status === 'done' ? `<div class="steps">${[1, 2, 3, 4].map(n => `<i class="${n <= step ? 'on' : ''}"></i>`).join('')}</div>` : ''}
    <div class="status ${tone}">${esc(text)}</div>
    ${open ? `<button class="act warn${isArmed(k) ? ' armed' : ''}" data-m="${m.id}" data-s="${i}"><b>${tr(isArmed(k) ? 'sure' : 'cancel')}</b></button>` : ''}
  </div>`;
}
// Orders placed on the robot screen (spec 6.3); their delivery still shows as missions below.
function orderCard(o) {
  const M = App.site.menu || { items: [] }, name = id => { const it = M.items.find(i => i.id === id); return it ? it[lang] || it.vi : id; };
  return `<div class="card item">
    <div class="row"><b>${tr('order')} #${o.id}</b><span class="small muted">${clock(o.t)}</span></div>
    <div class="what">${o.items.map(i => `${esc(name(i.id))} ×${i.qty}`).join(' · ')}</div>
    <div class="row"><span class="small muted">${tr('total')}</span><b>${vnd(o.total)}</b></div>
    <div class="status ${o.status === 'new' ? '' : 'ok'}">${tr(o.status === 'new' ? 'orderNew' : 'orderPaid')}</div></div>`;
}
// Call buttons rest 30 s after a tap; the station alert stays until staff ack it anyway.
const callUntil = { staff: 0, bill: 0 };
function render() {
  setHTML($('lang'), ['vi', 'en'].map(l => `<button data-lang="${l}" aria-pressed="${l === lang}">${l.toUpperCase()}</button>`).join(''));
  setHTML($('brand'), BRAND(tr('brand')));
  $('eyebrow').textContent = tr('eyebrow');
  $('help').textContent = tr('help');
  $('offline').textContent = tr('offline');
  document.documentElement.lang = lang;
  if (!App.site) return;
  $('title').textContent = App.site.points[T] ? tr('table')(short(T)) : T;
  const call = !!(App.site.features || {}).call;
  $('foot').hidden = !call;
  document.body.classList.toggle('ft', call);
  setHTML($('foot'), ['staff', 'bill'].map(w => `<button class="act ${w === 'staff' ? 'primary' : 'outline'}" data-call="${w}" ${Date.now() < callUntil[w] ? 'disabled' : ''}><b>${tr(w)}</b></button>`).join(''));
  if (!App.state) return;
  const rows = (App.state.orders || []).filter(o => o.table === T).map(orderCard);
  for (const m of [...App.state.missions, ...App.state.history]) {
    if (m.status !== 'queued' && m.status !== 'active' && serverNow() - (m.endedAt || 0) > 30 * 60 * 1000) continue;
    m.stops.forEach((s, i) => { if (s.a === 'handoff' && s.p === T) rows.push(item(m, i, s)); });
  }
  setHTML($('list'), rows.join('') || `<p class="empty">${tr('empty')}</p>`);
}
$('lang').addEventListener('click', e => {
  const b = e.target.closest('[data-lang]');
  if (!b) return;
  lang = b.dataset.lang;
  try { localStorage.setItem('mekoniq.lang', lang); } catch (err) {}
  render();
});
$('foot').addEventListener('click', e => {
  const b = e.target.closest('[data-call]');
  if (!b || b.disabled) return;
  const what = b.dataset.call;
  send({ type: 'call', point: T, what, by: 'Khách ' + pname(T) + ' (QR)' });
  callUntil[what] = Date.now() + 30000;
  toast(tr(what + 'Ok'));
  render();
});
$('list').addEventListener('click', e => {
  const b = e.target.closest('[data-m]');
  if (!b) return;
  const m = +b.dataset.m, s = +b.dataset.s;
  armed(`c-${m}-${s}`, () => send({ type: 'cancelStop', mission: m, stop: s, why: 'customer', by: 'Khách ' + pname(T) + ' (QR)' }), render);
});
render();
connect(m => { if (m.type === 'state' || m.type === 'site') render(); });
setInterval(render, 1000);
</script>
</body></html>
