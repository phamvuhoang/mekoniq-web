<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEKONIQ Serve · Bàn của bạn</title>
<link rel="icon" href="logo.svg"><link rel="stylesheet" href="brand.css">
<style>
  main { max-width: 560px; margin: auto; padding: 20px 16px 80px; display: grid; gap: 14px; }
  h1 { font-size: 44px; letter-spacing: -.05em; margin: 0; line-height: 1; }
  .item { display: grid; gap: 8px; }
  .item .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .steps { display: flex; gap: 4px; }
  .steps i { flex: 1; height: 6px; border-radius: 3px; background: var(--soft); }
  .steps i.on { background: var(--green); }
  .btn.wide { width: 100%; min-height: 48px; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
</style>
</head><body>
<header class="top"><div class="nav"><div id="brand"></div><span class="dot" id="conn" title="Kết nối"></span></div></header>
<main>
  <div><p class="eyebrow">Theo dõi món của bạn</p><h1 id="title">Bàn</h1></div>
  <div id="list"></div>
  <p class="small muted">Bạn có thể huỷ món đang trên đường tới. Nếu món đã lên khay, robot sẽ mang món về lại bếp/quầy. Cần hỗ trợ khác, vui lòng gọi nhân viên.</p>
</main>
<div id="offline" hidden>Mất kết nối — đang kết nối lại…</div>
<script src="transport.js"></script><script src="common.js"></script>
<script>
// Opened from the QR code on each table: table.html?t=T05
const T = new URLSearchParams(location.search).get('t') || 'T01';
const $ = id => document.getElementById(id);
$('brand').innerHTML = BRAND('Serve S1 · Khách hàng');

function item(m, i, s) {
  const r = m.robot && App.state.robots.find(x => x.id === m.robot);
  const what = pname(m.stops[0].p) === 'Quầy pha chế' ? 'Đồ uống' : 'Món ăn';
  let text, step;
  const open = s.status === 'pending' || s.status === 'active';
  if (s.status === 'done') [text, step] = ['Đã nhận · chúc ngon miệng', 4];
  else if (!open) [text, step] = [s.why === 'customer' ? 'Bạn đã huỷ món này' : 'Món đã được huỷ', 0];
  else if (m.status === 'queued') [text, step] = ['Đang chờ robot', 1];
  else if (!m.loaded) [text, step] = [`${pname(m.stops[0].p)} đang chuẩn bị · robot ${m.robot} tới lấy`, 2];
  else if (m.cur === i && r.phase === 'atStop') [text, step] = [`Robot ${m.robot} đã tới bàn — mời lấy món ở khay ${s.tray}`, 4];
  else if (m.cur === i) [text, step] = [`Robot ${m.robot} đang tới · khoảng ${etaSec(r)} giây`, 3];
  else [text, step] = [`Robot ${m.robot} đang giao bàn khác trước, sau đó tới bàn bạn`, 3];
  if (open && r && r.halt) text += ' (robot đang tạm dừng)';
  const k = `c-${m.id}-${i}`;
  return `<div class="card item">
    <div class="row"><b>${what} #${m.id}${s.tray ? ' · khay ' + s.tray : ''}</b><span class="small muted">${clock(m.createdAt)}</span></div>
    ${open || s.status === 'done' ? `<div class="steps">${[1, 2, 3, 4].map(n => `<i class="${n <= step ? 'on' : ''}"></i>`).join('')}</div>` : ''}
    <div>${esc(text)}</div>
    ${m.note && open ? `<div class="small muted">📝 ${esc(m.note)}</div>` : ''}
    ${open ? `<button class="btn wide ${isArmed(k) ? 'armed' : 'warn'}" data-m="${m.id}" data-s="${i}">${isArmed(k) ? 'Chạm lần nữa để huỷ món' : 'Huỷ món này'}</button>` : ''}
  </div>`;
}
function render() {
  if (!App.state) return;
  $('title').textContent = pname(T);
  const rows = [];
  for (const m of [...App.state.missions, ...App.state.history]) {
    if (m.status !== 'queued' && m.status !== 'active' && serverNow() - (m.endedAt || 0) > 30 * 60 * 1000) continue;
    m.stops.forEach((s, i) => { if (s.a === 'handoff' && s.p === T) rows.push(item(m, i, s)); });
  }
  setHTML($('list'), rows.join('') || '<p class="empty">Chưa có món nào đang tới bàn của bạn.</p>');
}
$('list').addEventListener('click', e => {
  const b = e.target.closest('[data-m]');
  if (!b) return;
  const m = +b.dataset.m, s = +b.dataset.s;
  armed(`c-${m}-${s}`, () => send({ type: 'cancelStop', mission: m, stop: s, why: 'customer', by: 'Khách ' + pname(T) + ' (QR)' }), render);
});
connect(m => { if (m.type === 'state') render(); });
setInterval(render, 1000);
</script>
</body></html>
